name = "vesperwind"
main = "worker/index.js"
compatibility_date = "2025-05-01"

# Durable Object 用于持久化每个用户的装扮状态
[[durable_objects.bindings]]
name = "WARDROBE"
class_name = "WardrobeDO"

[[migrations]]
tag = "v1"
new_classes = ["WardrobeDO"]

